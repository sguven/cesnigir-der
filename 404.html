<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Çeşnigir-Der</title>
<script>
/* Bulunamayan adres ana sayfaya gider. Paylaşım sayfası henüz yazılmamış bir kayıt (…/p/e-….html) ise doğrudan o kayda gider. */
(function () {
  var seg = location.pathname.split('/')[1] || '';
  var home = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
  var m = /^(.*\/)p\/([deir])-(.+?)(\.html)?$/.exec(location.pathname);
  if (m) return location.replace(m[1] + '?' + m[2] + '=' + m[3]);
  /* Kısa bağlantının (…/d/k3f9xa) dosyası henüz yazılmamışsa: kayıtlar içinde bu kodu taşıyanı bulup ona gider */
  m = /^(.*\/)([deir])\/([0-9a-z]{6})(\.html)?\/?$/.exec(location.pathname);
  if (!m) return location.replace(home);
  var base = m[1], key = m[2], code = m[3], file = { d: 'duyurular', e: 'etkinlikler', i: 'pazar', r: 'rehber' }[key];
  var s = document.createElement('script');
  s.src = base + 'ortak.js?v=' + Date.now();
  s.onerror = function () { location.replace(home); };
  s.onload = function () {
    var C = window.CD;
    fetch(base + 'data/' + file + '.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var x = C.arr(d).filter(function (x) { return C.shortCode(key, C.shareId(key, x), x.foto) === code; })[0];
      location.replace(x ? base + '?' + key + '=' + encodeURIComponent(C.shareId(key, x)) : home);
    }).catch(function () { location.replace(home); });
  };
  document.head.appendChild(s);
})();
</script>
</head>
<body style="font-family:sans-serif;padding:24px;font-size:20px"><p><a href="/">Çeşnigir-Der ana sayfa</a></p></body>
</html>
