# Yedek yönetim ekranı (Pages CMS): https://app.pagescms.org
# Asıl panel sitenin içinde: /yonetim/

media:
  input: images
  output: /images
  categories: [image]

content:
  - name: duyurular
    label: Duyurular
    type: file
    path: data/duyurular.json
    format: json
    list: true
    fields:
      - { name: tur, label: Tür, type: select, options: { values: [Vefat, Düğün, Nişan, Mevlit, Toplantı, Duyuru, Haber, Tarihten] } }
      - { name: tarih, label: Tarih, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: baslik, label: Başlık, type: string, required: true }
      - { name: metin, label: Açıklama, type: text }
      - { name: foto, label: Fotoğraf, type: image }
      - { name: olay_tarihi, label: Olayın tarihi (Tarihten yazıları için), type: string }
      - { name: kaynak, label: Haberin kaynağı, type: string }
      - { name: link, label: Haberin adresi, type: string }

  - name: etkinlikler
    label: Takvim
    type: file
    path: data/etkinlikler.json
    format: json
    list: true
    fields:
      - { name: tur, label: Tür, type: select, options: { values: [Düğün, Nişan, Mevlit, Toplantı, Etkinlik] } }
      - { name: tarih, label: Gün, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: ad, label: Etkinlik, type: string, required: true }
      - { name: saat, label: Saat, type: string }
      - { name: yer, label: Yer, type: string }
      - { name: foto, label: Fotoğraf, type: image }

  - name: pazar
    label: Market
    type: file
    path: data/pazar.json
    format: json
    list: true
    fields:
      - { name: tur, label: Tür, type: select, options: { values: [Satılık, Aranıyor, Yardım isteği] } }
      - { name: tarih, label: Tarih, type: date, options: { format: yyyy-MM-dd } }
      - { name: baslik, label: Başlık, type: string, required: true }
      - { name: fiyat, label: Fiyat (TL), type: string }
      - { name: aciklama, label: Açıklama, type: text }
      - { name: kisi, label: İlan sahibi, type: string }
      - { name: telefon, label: Başkanın telefonu, type: string }
      - { name: baskan2, label: Başkan yardımcısı, type: string }
      - { name: telefon2, label: Başkan yardımcısının telefonu, type: string }
      - { name: foto, label: Fotoğraf, type: image }

  - name: rehber
    label: Esnaf Rehberi
    type: file
    path: data/rehber.json
    format: json
    list: true
    fields:
      - { name: tur, label: Tür, type: select, options: { values: [Dükkân, Restoran, Sanayi, Okul, Hizmet, Diğer] } }
      - { name: tarih, label: Tarih, type: date, options: { format: yyyy-MM-dd } }
      - { name: baslik, label: İşletmenin adı, type: string, required: true }
      - { name: aciklama, label: Açıklama, type: text }
      - { name: adres, label: Adres, type: string }
      - { name: kisi, label: Yetkili, type: string }
      - { name: telefon, label: Telefon, type: string }
      - { name: link, label: Web sitesi ya da Instagram, type: string }
      - { name: foto, label: Kartvizit ya da fotoğraf, type: image }

  - name: galeri
    label: Fotoğraflar
    type: file
    path: data/galeri.json
    format: json
    list: true
    fields:
      - { name: foto, label: Fotoğraf, type: image, required: true }
      - { name: aciklama, label: Açıklama, type: string }

  - name: dernek
    label: Dernek Bilgileri
    type: file
    path: data/dernek.json
    format: json
    fields:
      - { name: hakkimizda, label: Hakkımızda, type: text }
      - { name: baskan, label: Başkan, type: string }
      - { name: telefon, label: Başkanın telefonu, type: string }
      - { name: baskan2, label: Başkan yardımcısı, type: string }
      - { name: telefon2, label: Başkan yardımcısının telefonu, type: string }
      - { name: yonetim_kurulu, label: Yönetim kurulu (her satıra bir isim), type: text }
      - { name: denetim_kurulu, label: Denetim kurulu (her satıra bir isim), type: text }
      - { name: whatsapp, label: WhatsApp, type: string }
      - { name: eposta, label: E-posta, type: string }
      - { name: adres, label: Adres, type: string }
      - { name: kasa_donem, label: Kasa dönemi, type: string }
      - { name: gelir, label: Gelir (TL), type: string }
      - { name: gider, label: Gider (TL), type: string }
      - { name: kasa, label: Kasadaki para (TL), type: string }

  - name: videolar
    label: Videolar
    type: file
    path: data/videolar.json
    format: json
    list: true
    fields:
      - { name: link, label: Videonun bağlantısı (YouTube / Instagram / Facebook), type: string, required: true }
      - { name: baslik, label: Videonun adı, type: string, required: true }
      - { name: aciklama, label: Açıklama, type: text }
      - { name: foto, label: Kapak fotoğrafı (YouTube için gerekmez), type: image }
      - { name: tarih, label: Tarih, type: date, options: { format: yyyy-MM-dd } }
