# Haber fotoğraflarını kaynak siteden indirip sitenin kendi klasörüne koyar.
# data/duyurular.json'da "foto_indir": true olan kayıt varsa çalışır (araclar/haber-foto-indir.py);
# yoksa birkaç saniyede biter. Ardından paylaşım/arama sayfalarını yeniden üretir ve yayınlar.
name: Haber fotoğrafları

on:
  push:
    branches: [main]
    paths: [data/duyurular.json]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: haber-fotolari
  cancel-in-progress: false

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: İndirilecek fotoğraf var mı?
        id: kontrol
        run: |
          n=$(python3 -c "import json;print(sum(1 for x in json.load(open('data/duyurular.json')) if isinstance(x,dict) and x.get('foto_indir')))")
          echo "Bekleyen: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Fotoğrafları indir
        if: steps.kontrol.outputs.n != '0'
        run: |
          pip install --quiet pillow
          python3 araclar/haber-foto-indir.py
          python3 araclar/kucuk-fotolar.py

      - name: Paylaşım ve arama sayfalarını üret
        if: steps.kontrol.outputs.n != '0'
        run: |
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          node araclar/site-sayfalari.js

      - name: Yayınla
        if: steps.kontrol.outputs.n != '0'
        run: |
          git config user.name "Haber fotoğrafları (otomatik)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/duyurular.json images/haber images/kucuk p d e i hakkimizda duyurular etkinlikler fotograflar iletisim gezilecek-yerler sitemap.xml; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -q -m "Haber fotoğrafları kaynaktan indirildi"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            echo "Push denemesi $i başarısız, tekrar deneniyor"; sleep 5
          done
          exit 1

      - name: Siteyi yeniden yayınlat
        if: steps.kontrol.outputs.n != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null && echo "Pages yeniden yayınlanıyor"
